# The full local gate (`make check`) run on every pull request and on `main`.
# Service topology mirrors docker-compose.yml; the variable set is owned by
# docs/deployment.md §11.
name: check

on:
  pull_request:
  push:
    branches: [main]

# The gate reads the repository and runs tests. It never writes back, so the
# default token permissions are wider than anything here needs.
permissions:
  contents: read

# A new push to the same ref supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole gate takes ~90s. Twenty minutes is generous headroom and still
    # fails fast on a job wedged against an unreachable service.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewsignal
          POSTGRES_PASSWORD: reviewsignal
          POSTGRES_DB: reviewsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewsignal -d reviewsignal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 3.12 is what ruff targets (`target-version = "py312"`) and what pyright
      # analyses against. Testing on a newer interpreter than the type checker
      # models would split the gate against itself.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `--locked` and `npm ci` fail on a stale lockfile. `make install` runs
      # `uv sync` and `npm install`, which would quietly update one instead.
      - name: Install dependencies
        run: |
          uv sync --locked
          cd apps/web && npm ci

      # Setup, not part of the gate: tests/conftest.py truncates tables but
      # never creates them, so the schema must already exist.
      #
      # The environment is set per step rather than per job so that checkout,
      # the toolchain actions, and every npm lifecycle script run by `npm ci`
      # never see these values.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://reviewsignal:reviewsignal@localhost:5432/reviewsignal
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: ci-not-a-real-secret
          CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: make migrate

      # CREDENTIAL_ENCRYPTION_KEY is required despite defaulting to "" in
      # `Settings`: core/crypto.py raises EncryptionKeyMissingError on an empty
      # key, so the tests that store a credential need a *valid* key, not merely
      # a set one. The value is 32 zero bytes — accepted by Fernet, and visibly
      # not something to copy into a real .env. Generate real keys with the
      # command in .env.example.
      - name: Run the gate
        env:
          DATABASE_URL: postgresql+psycopg://reviewsignal:reviewsignal@localhost:5432/reviewsignal
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: ci-not-a-real-secret
          CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: make check
