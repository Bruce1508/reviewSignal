# Local development topology (docs/deployment.md §3, §16).
# PostgreSQL runs here for local work; production uses RDS.
#
# Ollama: prefer running natively on macOS for hardware acceleration
# (docs/deployment.md §3) and point OLLAMA_BASE_URL at
# http://host.docker.internal:11434. The containerized service below is
# opt-in via `docker compose --profile ollama up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviewsignal
      POSTGRES_PASSWORD: reviewsignal
      POSTGRES_DB: reviewsignal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewsignal -d reviewsignal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://reviewsignal:reviewsignal@postgres:5432/reviewsignal
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://reviewsignal:reviewsignal@postgres:5432/reviewsignal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  redis-data:
  ollama-data:
